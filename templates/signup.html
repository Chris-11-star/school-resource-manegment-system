{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <section class="col-md-7 col-lg-5">
        <div class="panel">
            <p class="eyebrow">JOIN EDUHUB</p>
            <h1 class="h2">Create a student account</h1>
            <p class="text-muted mb-4">Choose a username and password to get started.</p>
            <form method="post">
                <input type="hidden" name="token" value="{{ session.token }}">
                <label class="form-label" for="username">Username</label>
                <input class="form-control mb-3" id="username" name="username" minlength="3" maxlength="32"
                       autocomplete="username" required autofocus>
                <label class="form-label" for="password">Password</label>
                <input class="form-control mb-3" id="password" name="password" type="password"
                       minlength="8" maxlength="128" autocomplete="new-password" required>
                <button class="btn btn-primary" type="submit">Create account</button>
            </form>
            <p class="text-muted mt-4 mb-0">
                Already registered? <a href="{{ url_for('login') }}">Log in</a>
            </p>
        </div>
    </section>
</div>
{% endblock %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}EduHub | School resources{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header>
        <nav class="container d-flex justify-content-between align-items-center py-3">
            <a class="brand" href="/">
                <b class="logo">E</b> EduHub <small>/ resource centre</small>
            </a>

            {% if g.user %}
            <form method="post" action="{{ url_for('logout') }}">
                <input type="hidden" name="token" value="{{ session.token }}">
                <button type="submit" class="btn btn-outline-secondary btn-sm">Logout</button>
            </form>
            {% endif %}
        </nav>
    </header>

    <main class="container py-5">
        {% for category, message in get_flashed_messages(with_categories=true) %}
        <div class="alert alert-{{ category }}" role="alert">
            {{ message }}
        </div>
        {% endfor %}
        {% block content %}{% endblock %}
    </main>

    <footer class="container py-4 small text-muted">
        EduHub &middot; School Resource Management System &middot;
    </footer>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
